common_pkgs_derivatives:
- main
- slurmweb-7
common_pkgs_priorities:
  slurmweb-7: 900
common_with_devs_repos: true
common_devs_derivatives:
- main
- slurmweb-7
common_devs_priorities:
  slurmweb-7: 900
common_hpckit_derivatives:
- main
- slurm26.11
fhpc_slurm_with_jwt: true
fhpc_slurmrestd_with_unix_socket: false
slurm_params:
  PriorityType: priority/multifactor
  PriorityWeightFairshare: 1000
  PriorityWeightQOS: 100
  SelectType: select/cons_tres
  PreemptType: preempt/qos
  PreemptMode: REQUEUE
  AccountingStorageTRES: "gres/gpu:h100,gres/shard"
slurm_qos:
- name: low
  args:
  - MaxWall=1-00:00:00
  - Priority=10
- name: study
  args:
  - Flags=OverPartQOS
  - GrpTRES=node=50
  - GrpJobs=60
  - MaxTRES=cpu=128
  - MaxWall=8:00:00
  - MaxTRESPU=cpu=128,mem=65536
  - MaxTRESPA=cpu=196,mem=131072
  - MaxJobsPU=10
  - MaxSubmitJobsPU=20
  - MaxSubmitJobsPA=30
  - Priority=100
  - Preempt=low
# Account coordinators to test jobs-view-coord and jobs-view-past-coord actions,
# assigned to members of physic group with limited role in Slurm-web policy.
# The first member of physic group coordinates physic account and its acoustic
# and optic sub-accounts, the first member of optic group coordinates optic
# account only.
slurm_coordinators:
- account: physic
  users:
  - "{{ (fhpc_groups | selectattr('name', 'equalto', 'physic') | first).members[0] }}"
- account: optic
  users:
  - "{{ (fhpc_groups | selectattr('name', 'equalto', 'optic') | first).members[0] }}"
slurm_partitions:
- name: normal
  nodes: cn[1-4]
  default: yes
  params:
    MaxTime: "2:0:0"
    State: UP
    DefMemPerCPU: 512
- name: gpu
  nodes: gpu[1-4]
  params:
    MaxTime: "2:0:0"
    State: UP
    DefMemPerCPU: 512
slurm_gpus_models_map:
  Nvidia H100:
    type: h100
  generic: {}
slurm_shards_per_gpu:
  gpu-xl-generic: 4
slurmweb_enabled: true
slurmweb_gateway_subdir: slurm-web/
slurmweb_agent_settings:
  metrics:
    enabled: true
redis_enabled: true
metrics_enabled: true
# Deploy CEEMS exporter and fake NVIDIA DCGM exporter on compute nodes for jobs
# metrics, with DCGM exporter 4.8.3+ metric names and hostname label.
ceems_enabled: true
nvidia_fake_dcgm_flavor: "4.8.4"
