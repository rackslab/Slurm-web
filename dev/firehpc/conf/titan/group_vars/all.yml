common_pkgs_derivatives:
- main
- slurmweb-7
common_pkgs_priorities:
  slurmweb-7: 900
common_with_devs_repos: true
common_hpckit_derivatives:
- main
- slurm25.11
common_devs_derivatives:
- main
- slurmweb-7
common_devs_priorities:
  slurmweb-7: 900
fhpc_slurm_with_jwt: true
slurm_with_db_archive: false
slurm_params:
  PriorityType: priority/multifactor
  PriorityWeightFairshare: 1000
  PriorityWeightQOS: 100
  SelectType: select/cons_tres
# Account coordinators, as on nova cluster, to crawl test assets of accounts with
# coordinators. The first member of physic group coordinates physic account and
# its acoustic and optic sub-accounts, the first member of optic group
# coordinates optic account only.
slurm_coordinators:
- account: physic
  users:
  - "{{ (fhpc_groups | selectattr('name', 'equalto', 'physic') | first).members[0] }}"
- account: optic
  users:
  - "{{ (fhpc_groups | selectattr('name', 'equalto', 'optic') | first).members[0] }}"
slurm_partitions:
- name: batch
  nodes: cn[001-080,101-532]
  default: yes
  params:
    MaxTime: INFINITE
    State: UP
    DefMemPerCPU: 512
    OverSubscribe: "FORCE:2"
- name: debug
  nodes: cn[081-099]
  params:
    MaxTime: "1:0:0"
    State: UP
    DefMemPerCPU: 512
- name: interactive
  nodes: cn100
  params:
    MaxTime: "10:00"
    State: UP
    DefMemPerCPU: 512
- name: maintenance
  nodes: cn[531-532]
  params:
    MaxTime: INFINITE
    State: DRAIN
    DefMemPerCPU: 512
slurm_qos:
- name: critical
  args:
  - GrpJobs=300
  - MaxWall=2-00:00:00
  - MaxJobsPU=10
  - MaxSubmitJobsPU=20
  - MaxSubmitJobsPA=30
  - Priority=200
- name: standby
  args:
  - MaxTRESPU=cpu=256
  - MaxWall=12:00:00
  - Priority=10
slurmweb_enabled: true
slurmweb_slurmrestd_jwt_mode: static
slurmweb_agent_settings:
  metrics:
    enabled: true
redis_enabled: true
metrics_enabled: true
