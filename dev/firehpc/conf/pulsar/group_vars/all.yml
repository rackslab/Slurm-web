common_pkgs_derivatives:
- main
- slurmweb-7
# On RedHat based distributions, dnf selects the repository with the lowest
# priority value (default 99). Prefer slurmweb-7 over main.
common_pkgs_priorities:
  slurmweb-7: 50
common_with_devs_repos: true
common_devs_derivatives:
- main
common_hpckit_derivatives:
- slurm26.05
# Prefer hpck.it Slurm packages over EPEL Slurm packages with the same names.
common_hpckit_priorities:
  slurm26.05: 50
fhpc_slurm_with_jwt: true
slurm_params:
  PriorityType: priority/multifactor
  PriorityWeightFairshare: 1000
  PriorityWeightQOS: 100
  SelectType: select/cons_tres
  AccountingStorageTRES: "gres/gpu:h100,gres/gpu:h200"
slurm_qos:
- name: study
  args:
  - Flags=OverPartQOS
  - GrpTRES=node=50
  - GrpJobs=60
  - MaxTRES=cpu=128
  - MaxWall=8:00:00
  - MaxTRESPU=cpu=128,mem=65536
  - MaxTRESPA=cpu=196,mem=131072
  - MaxJobsPU=10
  - MaxSubmitJobsPU=20
  - MaxSubmitJobsPA=30
  - Priority=100
# Account coordinators, as on nova cluster, to crawl test assets of accounts with
# coordinators. The first member of physic group coordinates physic account and
# its acoustic and optic sub-accounts, the first member of optic group
# coordinates optic account only.
slurm_coordinators:
- account: physic
  users:
  - "{{ (fhpc_groups | selectattr('name', 'equalto', 'physic') | first).members[0] }}"
- account: optic
  users:
  - "{{ (fhpc_groups | selectattr('name', 'equalto', 'optic') | first).members[0] }}"
slurm_partitions:
- name: normal
  nodes: cn[1-4]
  default: yes
  params:
    MaxTime: "2:0:0"
    State: UP
    DefMemPerCPU: 512
- name: gpu
  nodes: gpu[1-2]
  params:
    MaxTime: "2:0:0"
    State: UP
    DefMemPerCPU: 512
- name: all
  nodes: cn[1-4],gpu[1-2]
  params:
    MaxTime: "1:0:0"
    State: UP
    DefMemPerCPU: 512
slurm_gpus_models_map:
  Nvidia H100:
    type: h100
  Nvidia H200:
    type: h200
slurmweb_enabled: true
slurmweb_agent_settings:
  metrics:
    enabled: true
redis_enabled: true
metrics_enabled: true
# Deploy CEEMS exporter and fake NVIDIA DCGM exporter on compute nodes for jobs
# metrics, with DCGM exporter 4.9.0+ default counters metric names.
ceems_enabled: true
nvidia_fake_dcgm_flavor: current
